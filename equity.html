<script>
function fmt(v){
  if(v===null||v===undefined||v==="") return null;
  var n=parseFloat(v);
  return isNaN(n)?null:n;
}
function cls(n){ return n>0?"up":(n<0?"down":"zero"); }
function pct(n){ return (n>0?"+":"")+n.toFixed(2)+"%"; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

function cellHtml(x,share){
  var hd='<div class="cell-hd"><span class="share">'+share+' 类</span>'+
         '<span class="code">'+esc(x&&x.code)+'</span></div>';
  var n=fmt(x&&x.available?x.change:null);
  if(n===null){
    return '<div class="cell">'+hd+'<div class="missing">净值未出</div>'+
           '<div class="cell-note">净值日期 '+(x&&x.nav_date?esc(x.nav_date):'—')+'</div></div>';
  }
  return '<div class="cell">'+hd+
         '<div class="nav-row"><span class="nav">'+esc(x.nav||'—')+'</span>'+
         '<span class="chg '+cls(n)+'">'+pct(n)+'</span></div>'+
         '<div class="cell-note">单位净值 · 日增长率</div></div>';
}
function renderTodayInto(id,groups){
  var box=document.getElementById(id);
  if(!box) return;
  if(!groups||!groups.length){ box.innerHTML='<div class="empty">暂无数据</div>'; return; }
  box.innerHTML=groups.map(function(g,i){
    var da=g.a&&g.a.nav_date?g.a.nav_date:null;
    var dc=g.c&&g.c.nav_date?g.c.nav_date:null;
    var d=(da===dc)?(da||'—'):((da||'—')+' / '+(dc||'—'));
    var tag=g.is_qdii?'<span class="qdii-tag">QDII</span>':'';
    return '<div class="group-card"><div class="group-hd">'+
           '<span class="idx">'+(i+1)+'</span>'+
           '<span class="gname">'+esc(g.name)+'</span>'+
           tag+
           '<span class="gdate">'+esc(d)+'</span></div>'+
           '<div class="pair">'+cellHtml(g.a,'A')+cellHtml(g.c,'C')+'</div></div>';
  }).join('');
}
function renderToday(groups){ renderTodayInto('todayList',groups); }
function renderHistoryInto(id,records,groups){
  var t=document.getElementById(id);
  if(!t) return;
  if(!records||!records.length){ t.innerHTML='<tr><td class="empty">暂无历史数据</td></tr>'; return; }
  var head='<thead><tr><th>净值日期</th>'+(groups||[]).map(function(g){
    return '<th>'+esc(g.name)+(g.is_qdii?' · QDII':'')+'</th>';}).join('')+'</tr></thead>';
  var body='<tbody>'+records.map(function(r){
    var tds=(r.groups||[]).map(function(g){
      var a=fmt(g.a&&g.a.available?g.a.change:null);
      var c=fmt(g.c&&g.c.available?g.c.change:null);
      var ah=a===null?'<span class="dash">—</span>':'<span class="'+cls(a)+'">'+pct(a)+'</span>';
      var ch=c===null?'<span class="dash">—</span>':'<span class="'+cls(c)+'">'+pct(c)+'</span>';
      return '<td><span class="a">'+ah+'</span><span class="c">'+ch+'</span></td>';
    }).join('');
    return '<tr><td>'+esc(r.date)+'</td>'+tds+'</tr>';
  }).join('')+'</tbody>';
  t.innerHTML=head+body;
}
function renderHistory(records,groups){ renderHistoryInto('historyTable',records,groups); }
var CURRENT_DATA=null;
// 状态条/提示条在 tabs 之外，按当前 tab 对应的数据块刷新，避免口径串到另一个 tab
function renderStatus(m,fc){
  m=m||{};
  document.getElementById('latestDate').textContent=m.latest_date||'—';
  document.getElementById('genTime').textContent=m.generated_at?('更新于 '+m.generated_at+(m.update_note?' · '+m.update_note:'')):'';
  var hint=document.getElementById('hintBox');
  // QDII 按前一期披露净值展示属正常口径，告警只看非 QDII 产品是否出齐
  var pub=m.a_share_published_count, total=m.a_share_fund_count;
  if(typeof pub!=='number'||typeof total!=='number'){ pub=m.today_published_count; total=fc; }
  if(typeof pub!=='number') pub=(m.is_today_published===false?0:total);
  if(pub===0){
    hint.style.display='block';
    hint.innerHTML='今日净值尚未公布，各产品展示各自最近一期已披露净值。';
  }else if(pub<total){
    hint.style.display='block';
    hint.innerHTML='今日净值已披露 '+pub+' / '+total+' 只，其余展示各自最近一期已披露净值。';
  }else{ hint.style.display='none'; }
}
function render(d){
  CURRENT_DATA=d;
  var m=d.meta||{},groups=d.groups||[],records=d.records||[];
  var gc=m.group_count||groups.length,fc=m.fund_count||groups.length*2;
  renderStatus(m,fc);
  document.getElementById('ovDate').textContent=m.latest_date||'—';
  document.getElementById('ovChip').textContent=gc+' 组 / '+fc+' 只';
  document.getElementById('groupCnt').textContent='共 '+gc+' 组 · 每只标注自身净值日期';
  document.getElementById('historyCnt').textContent='近 '+records.length+' 个交易日 · 上行为 A 类，下行为 C 类';

  if(m.source){
    var qd=(m.qdii_groups||[]);
    var qdNote=qd.length?'<br>'+esc(qd.join('、'))+'（QDII）按各自披露日期展示最近一期净值。':'';
    document.getElementById('foot').innerHTML=
      '数据来源：'+esc(m.source)+'<br>'+
      esc(m.note||'单位净值与日增长率为原始披露数据。')+qdNote;
  }
  renderToday(groups);
  renderHistory(records,groups);
  renderIndex(d.index||{});
}
/* ---------- 指数监控渲染 ---------- */
function renderIndexRank(groups){
  var box=document.getElementById('idxRank');
  var rows=[];
  (groups||[]).forEach(function(g){
    var a=fmt(g.a&&g.a.available?g.a.change:null);
    if(a!==null) rows.push({name:g.name,change:a});
  });
  rows.sort(function(x,y){ return y.change-x.change; });
  if(!rows.length){ box.innerHTML='<div class="empty">暂无涨跌数据</div>';
    document.getElementById('idxRankCnt').textContent=''; return; }
  var max=Math.max.apply(null,rows.map(function(r){ return Math.abs(r.change); }))||1;
  box.innerHTML=rows.map(function(r){
    var w=Math.abs(r.change)/max*48; // 最多占半轨，留零轴两侧
    var style=r.change>=0?('left:50%;width:'+w+'%;background:var(--red)'):
                          ('right:50%;width:'+w+'%;background:var(--green)');
    return '<div class="rank-row"><span class="rank-name">'+esc(r.name)+'</span>'+
           '<span class="rank-track"><i class="rank-bar" style="'+style+'"></i></span>'+
           '<span class="rank-val '+cls(r.change)+'">'+pct(r.change)+'</span></div>';
  }).join('');
  document.getElementById('idxRankCnt').textContent='共 '+rows.length+' 只 · 按 A 类日增长率排序';
}
function renderIndex(data){
  var m=data.meta||{},groups=data.groups||[],records=data.records||[];
  document.getElementById('idxGroupCnt').textContent=
    m.group_count?('共 '+m.group_count+' 组 · '+m.fund_count+' 只'):'暂无数据';
  document.getElementById('idxHistoryCnt').textContent=
    records.length?('近 '+records.length+' 个交易日 · 上行为 A 类，下行为 C 类'):'';
  renderIndexRank(groups);
  renderTodayInto('idxTodayList',groups);
  renderHistoryInto('idxHistoryTable',records,groups);
}
function switchTab(name){
  ['today','index','history'].forEach(function(k){
    document.getElementById('tab-'+k).classList.toggle('active',k===name);
    document.getElementById('panel-'+k).classList.toggle('active',k===name);
  });
  if(CURRENT_DATA){
    var d=(name==='index'&&CURRENT_DATA.index)?CURRENT_DATA.index:CURRENT_DATA;
    var m=d.meta||{},fc=m.fund_count||((d.groups||[]).length*2);
    renderStatus(m,fc);
  }
}
function setLoading(on){
  var b=document.getElementById('refreshBtn'),i=document.getElementById('refreshIcon');
  b.classList.toggle('loading',on);
  i.className=on?'spin':'';
}
var toastTimer=null;
function toast(msg){
  var t=document.getElementById('toastBox');
  if(!t){ t=document.createElement('div'); t.id='toastBox'; t.className='toast'; document.body.appendChild(t); }
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(function(){ t.classList.remove('show'); },2800);
}
/* 三路线上数据源 + 内置快照：并发取回后按 generated_at 选最新，绕开 Pages / CDN 缓存 */
var DATA_SOURCES=[
  {url:'equity-data.json?v=',label:'页面同域'},
  {url:'https://raw.githubusercontent.com/uvinnn/swsmu-equity-daily/main/equity-data.json?v=',label:'GitHub raw'},
  {url:'https://cdn.jsdelivr.net/gh/uvinnn/swsmu-equity-daily@main/equity-data.json?v=',label:'jsDelivr'}
];
function stamp(d){
  if(!d||!d.meta||!d.meta.generated_at) return '';
  return String(d.meta.generated_at).slice(0,19);
}
function boot(manual){
  var inline=null;
  try{ inline=JSON.parse(document.getElementById('inline-data').textContent.trim()||'null'); }catch(e){}
  function fallback(){
    setLoading(false);
    if(inline&&inline.groups&&inline.groups.length) render(inline);
    else document.getElementById('todayList').innerHTML='<div class="empty">数据未加载，请先运行抓数脚本</div>';
  }
  var pool=[],remoteOk=0,settled=0,finished=false,ts=Date.now();
  if(inline&&inline.groups&&inline.groups.length) pool.push({d:inline,from:'内置快照'});
  function finish(){
    if(finished) return;
    finished=true; setLoading(false);
    pool.sort(function(a,b){ return stamp(b.d).localeCompare(stamp(a.d)); });
    if(!pool.length){ fallback(); if(manual) toast('网络未连通，已显示页面内置快照'); return; }
    var best=pool[0];
    render(best.d);
    if(manual){
      if(remoteOk===0) toast('线上数据源暂不可达，已显示页面内置快照');
      else toast('已同步 · 数据更新于 '+(best.d.meta&&best.d.meta.generated_at?best.d.meta.generated_at:'—'));
    }
  }
  setLoading(true);
  var timer=setTimeout(finish,4500);
  DATA_SOURCES.forEach(function(src){
    fetch(src.url+ts,{cache:'no-cache'})
      .then(function(r){ return r.ok?r.json():Promise.reject(new Error('http '+r.status)); })
      .then(function(d){ if(d&&d.groups){ pool.push({d:d,from:src.label}); remoteOk++; } })
      .catch(function(){})
      .then(function(){
        settled++;
        if(settled===DATA_SOURCES.length){ clearTimeout(timer); finish(); }
      });
  });
}
function reload(){ boot(true); }
boot();
</script>
