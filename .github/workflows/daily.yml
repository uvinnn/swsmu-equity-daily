name: 权益净值每日更新

# 北京时间 = UTC+8；仅工作日跑，覆盖 19:40–21:15 的净值披露窗口
# 19:45 / 20:15 / 20:45 / 21:15 对应 UTC 11:45 / 12:15 / 12:45 / 13:15
on:
  schedule:
    - cron: '45 11 * * 1-5'
    - cron: '15 12 * * 1-5'
    - cron: '45 12 * * 1-5'
    - cron: '15 13 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: equity-nav-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取净值并回写页面内联数据
        run: python scripts/equity_daily.py

      - name: 数据完整性护栏
        run: |
          python - <<'PY'
          import json, sys
          d = json.load(open('equity-data.json', encoding='utf-8'))
          m = d['meta']
          groups = len(d['groups'])
          failures = len(m['fetch_failures'])
          print('groups =', groups, '| funds =', m['fund_count'],
                '| history_days =', m['history_days'], '| fetch_failures =', failures)
          if groups != m['group_count'] or groups * 2 != m['fund_count']:
              sys.exit('清单数量异常，拒绝发布')
          if failures:
              sys.exit('存在抓取失败，拒绝发布')
          if m['history_days'] < 20:
              sys.exit('历史数据不足，拒绝发布')
          PY

      - name: 提交快照
        run: |
          git config user.name "equity-nav-bot"
          git config user.email "equity-nav-bot@users.noreply.github.com"
          git add equity-data.json equity.html index.html output/equity_daily_summary.txt
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: 净值快照 $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
